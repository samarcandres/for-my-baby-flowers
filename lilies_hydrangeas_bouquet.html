<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>For you — a bouquet in code</title><style>*{box-sizing:border-box}body{margin:0;background:#090c16;color:#f9e9ed;font-family:Georgia,serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}.overlay{position:absolute;bottom:5%;width:100%;text-align:center;pointer-events:none}.overlay h1{font-weight:400;letter-spacing:.14em;font-size:clamp(17px,3vw,28px);margin:0 0 9px}.overlay p{font:11px ui-monospace,monospace;letter-spacing:.2em;color:#aeb3cc}.top{position:absolute;top:22px;left:25px;font:11px ui-monospace,monospace;letter-spacing:.14em;color:#777e9b}button{position:absolute;right:22px;top:20px;border:1px solid #55516a;background:#191a2c;color:#e8d5e2;padding:10px 14px;border-radius:22px;cursor:pointer}</style><div class="top">// a bouquet, written in starlight</div><button id="replay">Bloom again ↻</button><canvas id="c"></canvas><div class="overlay"><h1>for you, always ♡</h1><p>lilies · hydrangeas · a little bit of magic</p></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,dpr,start=performance.now();const glyphs='✦·+*.:', dots=[];let flowers=[];function rand(seed){let x=Math.sin(seed*127.1+78.233)*43758.5453;return x-Math.floor(x)}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);build()}window.addEventListener('resize',resize);
function build(){dots.length=0;for(let i=0;i<115;i++)dots.push({x:rand(i+2)*W,y:rand(i+400)*H,r:rand(i+600)*1.4+.3,p:rand(i+100)*6.28});flowers=[{type:'hyd',x:-.26,y:-.24,s:1.08,color:['#b9a8ee','#d9c6ff','#8d9cde']},{type:'hyd',x:.25,y:-.26,s:1.12,color:['#a4c8ed','#c6d8f6','#a9a1df']},{type:'hyd',x:-.37,y:-.03,s:.8,color:['#c7b0e7','#e1c9f2','#a6b6e4']},{type:'hyd',x:.37,y:-.03,s:.82,color:['#a5c4ed','#c5e0ee','#c9b4ed']},{type:'lily',x:-.09,y:-.39,s:1.06,color:['#fff1e5','#f3b7c8']},{type:'lily',x:.13,y:-.43,s:1.13,color:['#fff7ed','#f6c9d6']},{type:'lily',x:-.44,y:-.19,s:.85,color:['#ffe7e7','#e9a1bb']},{type:'lily',x:.44,y:-.22,s:.86,color:['#fff1e4','#efb4c7']},{type:'lily',x:.02,y:-.12,s:.95,color:['#fff4e9','#f4c1d2']}];}
function char(x,y,ch,color,size=10,alpha=1){ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.font=`${size}px ui-monospace,Menlo,monospace`;ctx.textAlign='center';ctx.fillText(ch,x,y);ctx.globalAlpha=1}function line(x1,y1,x2,y2,col,width=1){ctx.strokeStyle=col;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo((x1+x2)/2+12,(y1+y2)/2,x2,y2);ctx.stroke()}
function leaf(x,y,a,len,alpha){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.globalAlpha=alpha;ctx.fillStyle='#3b725c';ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(len*.45,-len*.3,len,0);ctx.quadraticCurveTo(len*.45,len*.22,0,0);ctx.fill();for(let j=0;j<12;j++){let t=j/12;char(t*len,Math.sin(t*Math.PI)*-len*.06,'·','#9ac6a0',8,.7)}ctx.restore();ctx.globalAlpha=1}
function lily(cx,cy,scale,colors,seed,alpha,t){let r=55*scale;for(let p=0;p<6;p++){let a=p*Math.PI/3-.45+Math.sin(t*.00065+seed)*.025;for(let j=0;j<95;j++){let u=(j%19)/18,v=Math.floor(j/19)/4;let theta=a+(v-.5)*(.75*Math.sin(u*Math.PI)**.65);let radius=r*(.15+u*.9);let px=cx+Math.cos(theta)*radius,py=cy+Math.sin(theta)*radius*.8;let edge=Math.abs(v-.5)*2;let col=edge>.72?colors[1]:colors[0];char(px,py,['·','*','✦','+'][Math.floor(rand(j*31+seed+p)*4)],col,7+rand(j+seed)*4,alpha*(.55+.4*(1-edge)))} }for(let k=0;k<6;k++){let a=k*Math.PI/3+.35;line(cx,cy,cx+Math.cos(a)*r*.48,cy+Math.sin(a)*r*.43,'#d3a95e',1);char(cx+Math.cos(a)*r*.48,cy+Math.sin(a)*r*.43,'•','#f4bd6a',10,alpha)}char(cx,cy,'✳','#f8d18a',16,alpha)}
function hyd(cx,cy,scale,colors,seed,alpha,t){let R=61*scale;for(let k=0;k<43;k++){let a=k*2.39996+seed,r=R*Math.sqrt((k+.4)/43),fx=cx+Math.cos(a)*r,fy=cy+Math.sin(a)*r*.8;let size=(9+rand(k+seed)*5)*scale;for(let p=0;p<4;p++){let th=p*Math.PI/2+.785;for(let j=1;j<=4;j++){let px=fx+Math.cos(th)*j*size/4,py=fy+Math.sin(th)*j*size/4;char(px,py,j===4?'✦':'•',colors[(k+p)%colors.length],7+scale*3,alpha*(.65+.3*rand(k+j+p)))} }char(fx,fy,'·','#f9e4ab',8,alpha)}}
function render(now){let t=now-start;ctx.clearRect(0,0,W,H);let bg=ctx.createRadialGradient(W*.5,H*.39,30,W*.5,H*.48,Math.max(W,H)*.75);bg.addColorStop(0,'#1d1b32');bg.addColorStop(.52,'#101322');bg.addColorStop(1,'#070a13');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let d of dots){char(d.x,d.y,'·','#d7c5ec',d.r*6,.13+.3*(.5+.5*Math.sin(t*.001+d.p)))}let S=Math.min(W/700,H/800,1.3),bx=W*.5,by=H*.57,baseY=by+220*S;let reveal=Math.min(1,t/3400);let smooth=reveal*reveal*(3-2*reveal);ctx.save();ctx.translate(bx,by);for(let i=0;i<flowers.length;i++){let f=flowers[i],x=f.x*470*S,y=f.y*500*S;let wave=Math.sin(t*.0008+i)*2.2*S;line(0,220*S,x+wave,y,'#47785b',2.5*S);if(i%2===0)leaf(x*.5,110*S+(y-110*S)*.45,i%3?-.9:Math.PI+.4,62*S,smooth);if(i%3===0)leaf(x*.68,90*S+(y-90*S)*.65,i%2?.3:2.8,50*S,smooth)}for(let i=0;i<flowers.length;i++){let f=flowers[i],x=f.x*470*S+Math.sin(t*.0008+i)*2.2*S,y=f.y*500*S;let a=Math.max(0,Math.min(1,(t-200-i*210)/950));let bloom=a*a*(3-2*a);if(f.type==='hyd')hyd(x,y,S*f.s*bloom,f.color,i*11,bloom,t);else lily(x,y,S*f.s*bloom,f.color,i*13,bloom,t)}ctx.restore();ctx.strokeStyle='#d3a0b4';ctx.lineWidth=2*S;ctx.beginPath();ctx.moveTo(bx-18*S,baseY-70*S);ctx.quadraticCurveTo(bx+4*S,baseY-46*S,bx+22*S,baseY-75*S);ctx.stroke();char(bx,baseY-55*S,'♡','#eab3cb',20*S,smooth);requestAnimationFrame(render)}document.getElementById('replay').onclick=()=>{start=performance.now()};resize();requestAnimationFrame(render);
</script></html>
